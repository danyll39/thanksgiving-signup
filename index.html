<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Sign-Up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbf5ec;--card:#fffdf9;--ink:#3a2a1e;--muted:#8a7362;--line:#ecdfcd;--accent:#c4561f;--accent2:#8f3b14;--leaf:#6b7a2e;--soft:#f6e6d3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:22px}
.leaf{font-size:30px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:6px 0 8px;color:var(--accent2)}
.sub{color:var(--muted);margin:0}
.progress{margin:18px auto 0;max-width:360px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#e0913a);border-radius:99px;transition:width .4s}
.ptext{font-size:13px;color:var(--muted);margin-top:6px}
.namebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:center}
.namebox label{font-weight:600;white-space:nowrap}
input[type=text]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:2px solid #e9b48f;border-color:var(--accent)}
section{margin-bottom:22px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2 small{font-family:Inter,sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-left:auto}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dish{flex:1;min-width:0}
.dish b{font-weight:500;display:block}
.who{font-size:13px;color:var(--leaf);font-weight:600}
.open{font-size:13px;color:var(--muted)}
.row.taken .dish b{color:var(--muted)}
button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.claim{background:var(--accent);color:#fff}
.claim:hover{background:var(--accent2)}
.undo{background:var(--soft);color:var(--accent2)}
.check{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);font-size:14px;color:#fff}
.row.taken .check{background:var(--leaf);border-color:var(--leaf)}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px dashed var(--line);background:#fffaf3}
.add input{padding:8px 10px;font-size:14px}
.add button{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:7px 12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .25s;pointer-events:none;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.ro .claim,.ro .undo,.ro .add{display:none}
.status{text-align:center;color:var(--muted);padding:30px 10px}
.status.err{color:var(--accent2)}
button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  // Paste your Google Apps Script web app URL here (it ends in /exec).
  var SCRIPT_URL = '';

  var TITLE = 'Thanksgiving Potluck', WHEN = 'Thursday, November 26';
  var ICONS = {Mains:'🦃',Sides:'🥔',Appetizers:'🧀',Desserts:'🥧',Drinks:'🍷',Supplies:'🍽️'};
  var ORDER = ['Mains','Sides','Appetizers','Desserts','Drinks','Supplies'];
  var items = null, busy = false, loadError = '';
  var myName = '';
  try { myName = localStorage.getItem('tg-name') || ''; } catch(e){}

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
  function mine(who){return !!norm(myName)&&norm(who)===norm(myName);}
  function refreshUndo(){document.querySelectorAll('[data-undo]').forEach(function(b){b.hidden=!mine(b.getAttribute('data-who'));});}
  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2800);}

  function render(){
    var root=document.getElementById('root');
    var focused=document.activeElement, keep=focused&&focused.id==='me'?[focused.selectionStart,focused.selectionEnd]:null;
    var addDrafts={}; document.querySelectorAll('form.add').forEach(function(f){var v=f.querySelector('input').value;if(v)addDrafts[f.getAttribute('data-cat')]=v;});
    var h='<div class="wrap"><header><div class="leaf">🍂</div><h1>'+esc(TITLE)+'</h1><p class="sub">'+esc(WHEN)+' · Pick a dish to bring</p>';
    if(items){
      var total=items.length, done=items.filter(function(i){return i.who;}).length;
      h+='<div class="progress"><div class="bar"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div><div class="ptext">'+done+' of '+total+' covered</div></div>';
    }
    h+='</header>';
    if(!items){
      h+='<p class="status'+(loadError?' err':'')+'">'+esc(loadError||'Loading the list…')+'</p></div>';
      root.innerHTML=h; return;
    }
    h+='<div class="namebox"><label for="me">Your name</label><input id="me" type="text" maxlength="40" placeholder="e.g. Aunt Linda" value="'+esc(myName)+'"></div>';
    var cats=ORDER.slice(); items.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
    cats.forEach(function(cat){
      var list=items.filter(function(i){return i.cat===cat;});
      var open=list.filter(function(i){return !i.who;}).length;
      h+='<section><h2>'+(ICONS[cat]||'🍴')+' '+esc(cat)+'<small>'+(!list.length?'':open?open+' open':'all set ✓')+'</small></h2><div class="list">';
      list.forEach(function(i){
        h+='<div class="row'+(i.who?' taken':'')+'"><span class="check">'+(i.who?'✓':'')+'</span><div class="dish"><b>'+esc(i.name)+'</b>'+
          (i.who?'<span class="who">'+esc(i.who)+' is bringing this</span>':'<span class="open">Still needed</span>')+'</div>'+
          (i.who?'<button class="undo" data-undo="'+esc(i.id)+'" data-who="'+esc(i.who)+'"'+(mine(i.who)?'':' hidden')+(busy?' disabled':'')+'>Remove</button>'
                :'<button class="claim" data-claim="'+esc(i.id)+'"'+(busy?' disabled':'')+'>I\'ll bring it</button>')+'</div>';
      });
      h+='<form class="add" data-cat="'+esc(cat)+'"><input type="text" maxlength="60" placeholder="Bringing something else?" value="'+esc(addDrafts[cat]||'')+'"><button type="submit"'+(busy?' disabled':'')+'>Add</button></form></div></section>';
    });
    h+='<p class="note">Your sign-up saves for everyone automatically.</p></div>';
    root.innerHTML=h;
    if(keep){var me=document.getElementById('me');me.focus();try{me.setSelectionRange(keep[0],keep[1]);}catch(e){}}
  }

  function load(){
    if(!SCRIPT_URL){loadError='This list isn\'t connected to its Google Sheet yet.';render();return;}
    if(busy)return;
    fetch(SCRIPT_URL).then(function(r){return r.json();}).then(function(d){
      if(busy)return;
      if(d&&d.items){items=d.items;loadError='';}
      render();
    }).catch(function(){ if(!items){loadError='Couldn\'t load the list. Please refresh the page.';render();} });
  }

  function send(payload){
    if(!SCRIPT_URL){toast('This list isn\'t connected yet.');return;}
    busy=true; render();
    payload.name=myName.trim();
    fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(function(r){return r.json();})
      .then(function(d){ if(d.items)items=d.items; toast(d.ok?d.message:d.error); })
      .catch(function(){ toast('Couldn\'t save. Please try again.'); })
      .then(function(){ busy=false; render(); });
  }

  function needName(){
    var el=document.getElementById('me');
    myName=(el&&el.value.trim())||'';
    if(!myName){toast('Type your name first 🙂');if(el)el.focus();return true;}
    try{localStorage.setItem('tg-name',myName);}catch(e){}
    return false;
  }

  document.addEventListener('input',function(e){if(e.target.id==='me'){myName=e.target.value;try{localStorage.setItem('tg-name',myName.trim());}catch(x){}refreshUndo();}});
  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||busy||b.disabled)return;
    var id=b.getAttribute('data-claim'), uid=b.getAttribute('data-undo');
    if(id){ if(needName())return; send({action:'claim',id:id}); }
    if(uid){ if(needName())return; send({action:'remove',id:uid}); }
  });
  document.addEventListener('submit',function(e){
    var f=e.target.closest('form.add'); if(!f)return; e.preventDefault(); if(busy)return;
    var inp=f.querySelector('input'), dish=inp.value.trim(); if(!dish)return;
    if(needName())return;
    inp.value='';
    send({action:'add',cat:f.getAttribute('data-cat'),dish:dish});
  });

  render(); load();
  setInterval(function(){ if(!document.hidden)load(); },20000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)load(); });
})();
</script>
</body>
</html>
